name: tmp-aplicar-ia

on:
  push:
    branches: [claude/borrador-ia]

jobs:
  aplicar:
    if: "!contains(github.event.head_commit.message, '[aplicado]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/borrador-ia
          fetch-depth: 0
      - name: Reunir y verificar el parche
        run: |
          set -e
          for f in tmp-cambio/parte-*; do
            echo "$f $(md5sum < "$f")"
          done
          cat tmp-cambio/parte-* | tr -d '\n\r ' > /tmp/cambio.b64
          echo "e73c4881decef174a441344e673c5e96  /tmp/cambio.b64" | md5sum -c -
      - name: Aplicar
        run: |
          set -e
          base64 -d < /tmp/cambio.b64 | gunzip > /tmp/cambio.patch
          git apply --binary /tmp/cambio.patch
          rm -rf tmp-cambio .github/workflows/tmp-aplicar-ia.yml
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "feat(contenidos): borrador de materiales asistido por IA [aplicado]"
          git push origin claude/borrador-ia
