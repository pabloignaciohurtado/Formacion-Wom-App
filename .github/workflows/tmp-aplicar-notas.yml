name: aplicar-notas
on:
  push:
    branches: [claude/notas-ia]
jobs:
  aplicar:
    if: "!contains(github.event.head_commit.message, '[aplicado]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar parche
        run: |
          set -e
          cat tmp-cambio/parte-* | tr -d '\n\r ' > /tmp/cambio.b64
          echo "26eeb7b509b76ea8cb4c8665ef7b03d9  /tmp/cambio.b64" | md5sum -c -
          base64 -d < /tmp/cambio.b64 | gunzip > /tmp/cambio.patch
          git apply --binary /tmp/cambio.patch
          rm -rf tmp-cambio .github/workflows/tmp-aplicar-notas.yml
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "docs: registrar el borrador asistido por IA en CLAUDE.md [aplicado]"
          git push origin claude/notas-ia
