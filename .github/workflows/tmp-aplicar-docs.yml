name: tmp-aplicar-docs

on:
  push:
    branches: [claude/docs-creador-materiales]

jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[aplicado]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir y aplicar el parche
        run: |
          set -e
          cat tmp-cambio/parte-00 | tr -d '\n\r ' > /tmp/cambio.b64
          echo "853bcf890f2dc38306980244ea5b4015  /tmp/cambio.b64" | md5sum -c -
          base64 -d /tmp/cambio.b64 | gunzip > /tmp/cambio.patch
          git apply --binary /tmp/cambio.patch
          rm -rf tmp-cambio .github/workflows/tmp-aplicar-docs.yml

      - name: Commitear
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: documentar el creador de materiales de aprendizaje [aplicado]"
          git push
