name: Aplicar nota de CLAUDE.md

on:
  push:
    branches:
      - claude/notas-modo-oscuro

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/notas-modo-oscuro
      - name: Aplicar el parche
        run: |
          set -euo pipefail
          if [ -f tmp-claudemd.patch ]; then
            git apply tmp-claudemd.patch
            rm tmp-claudemd.patch
          fi
          rm -f .github/workflows/tmp-nota-claudemd.yml
          git diff --stat
      - name: Commitear si hay cambios
        run: |
          set -euo pipefail
          if git diff --quiet; then echo 'Nada que hacer.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: gotchas de modo oscuro, capturas y push de changesets grandes en CLAUDE.md'
          git push origin HEAD:claude/notas-modo-oscuro
