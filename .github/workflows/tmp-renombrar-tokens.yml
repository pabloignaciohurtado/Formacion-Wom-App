# Workflow TEMPORAL de un solo uso. Aplica el parche de documentación y luego
# se borra a sí mismo junto con el parche, dejando la rama limpia.
#
# Existe porque la sesión remota que hizo el cambio no podía subir archivos
# grandes enteros; el diff de DOCUMENTACION.md pesa 4 KB frente a los 53 KB
# del archivo completo.

name: tmp renombrar tokens

on:
  push:
    branches:
      - claude/modo-oscuro-seleccionable

jobs:
  renombrar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/modo-oscuro-seleccionable

      - name: Aplicar el parche de documentación
        run: |
          set -euo pipefail
          if [ -f tmp-doc.patch ]; then
            git apply tmp-doc.patch
            rm tmp-doc.patch
          fi
          rm -f .github/workflows/tmp-renombrar-tokens.yml
          git diff --stat

      - name: Commitear si hay cambios
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nada que hacer.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: modo oscuro seleccionable en DOCUMENTACION.md'
          git push origin HEAD:claude/modo-oscuro-seleccionable
