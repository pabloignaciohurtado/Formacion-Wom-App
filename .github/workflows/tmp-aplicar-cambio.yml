name: tmp-aplicar-cambio

on:
  push:
    branches: [claude/creador-materiales]

jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[aplicado]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir y aplicar el parche
        run: |
          set -e
          md5sum tmp-cambio/parte-00 tmp-cambio/parte-01 tmp-cambio/parte-02
          cat tmp-cambio/parte-00 tmp-cambio/parte-01 tmp-cambio/parte-02 | tr -d '\n\r ' > /tmp/cambio.b64
          echo "70afc71261d47ef32e5c8c1b69af9e31  /tmp/cambio.b64" | md5sum -c -
          base64 -d /tmp/cambio.b64 | gunzip > /tmp/cambio.patch
          git apply --binary /tmp/cambio.patch
          rm -rf tmp-cambio .github/workflows/tmp-aplicar-cambio.yml

      - name: Commitear
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(contenidos): creador de materiales de aprendizaje (lecciones + ejercicios) [aplicado]"
          git push
