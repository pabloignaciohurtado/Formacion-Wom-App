name: tmp aplicar doc
on:
  push:
    branches: [claude/doc-transcripciones]
jobs:
  aplicar:
    if: "!contains(github.event.head_commit.message, '[aplicado]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unir trozos y verificar md5
        run: |
          set -e
          cat tmp-cambio/parte-* | tr -d '\n\r ' > /tmp/cambio.b64
          echo 'df0f05b573e21a91b15297bcb060038f  /tmp/cambio.b64' | md5sum -c -
      - name: Aplicar parche
        run: |
          set -e
          base64 -d /tmp/cambio.b64 | gunzip > /tmp/cambio.patch
          git apply --binary /tmp/cambio.patch
      - name: Limpiar y commitear
        run: |
          set -e
          rm -rf tmp-cambio .github/workflows/tmp-aplicar-doc.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: registrar las tres vias de generacion con IA [aplicado]'
          git push
