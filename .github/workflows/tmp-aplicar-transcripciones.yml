name: tmp aplicar transcripciones

on:
  push:
    branches: [claude/transcripciones-leccion]

jobs:
  aplicar:
    if: "!contains(github.event.head_commit.message, '[aplicado]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unir trozos y verificar md5
        run: |
          set -e
          cat tmp-cambio/parte-* | tr -d '\n\r ' > /tmp/cambio.b64
          echo '6a40bd9e886483e786881b36d263912a  /tmp/cambio.b64' | md5sum -c -

      - name: Aplicar parche
        run: |
          set -e
          base64 -d /tmp/cambio.b64 | gunzip > /tmp/cambio.patch
          git apply --binary /tmp/cambio.patch

      - name: Limpiar y commitear
        run: |
          set -e
          rm -rf tmp-cambio .github/workflows/tmp-aplicar-transcripciones.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: generar lecciones desde transcripciones de llamadas [aplicado]'
          git push
